server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    # Backend API requests proxying
    location /api/ {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Sockets routing integration
    location /socket.io/ {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Keep WebSocket connections alive for up to 1 hour.
        # Without these, Nginx closes idle WS connections at 60s (default),
        # which triggers "WebSocket is closed before connection is established"
        # on the next reconnect attempt.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static uploads serving path
    location /uploads/ {
        proxy_pass http://app:5000/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
